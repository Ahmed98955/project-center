<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — شاشة القائد</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(1200px 800px at 70% -10%, #16305c 0%, #0f1f3d 55%, #0a1428 100%); color: #e8eefc; }
  .card { width: 380px; background: rgba(255,255,255,.06); border: 1px solid rgba(245,185,65,.35); border-radius: 18px;
          padding: 36px 30px; backdrop-filter: blur(6px); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .logo { text-align: center; font-size: 46px; margin-bottom: 6px; }
  h1 { text-align: center; font-size: 20px; color: #f5b941; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 12.5px; color: #9fb2d8; margin-bottom: 26px; }
  label { display: block; font-size: 12.5px; color: #c9d6f2; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #33507f; background: #0d1c38;
          color: #fff; font-size: 14px; outline: none; }
  input:focus { border-color: #f5b941; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
           background: linear-gradient(135deg, #f5b941, #e09f1f); color: #231a05; font-size: 15px; font-weight: 700; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: rgba(220,60,60,.15);
         border: 1px solid rgba(220,60,60,.5); color: #ffb4b4; font-size: 12.5px; text-align: center; }
  .foot { margin-top: 20px; text-align: center; font-size: 11px; color: #6d7ea6; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎖️</div>
  <h1>شاشة القائد</h1>
  <div class="sub">نظام إدارة العمليات والمشروعات — تسجيل الدخول</div>
  <form id="f">
    <label for="u">اسم المستخدم</label>
    <input id="u" autocomplete="username" required autofocus>
    <label for="p">كلمة المرور</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">دخول</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">الوصول مقصور على المستخدمين المصرح لهم · جميع العمليات مسجلة</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next') || '/';
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value.trim(),
                             password: document.getElementById('p').value })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || 'فشل تسجيل الدخول');
    location.href = next.startsWith('/') ? next : '/';
  } catch (ex) {
    err.textContent = ex.message; err.style.display = 'block';
    b.disabled = false;
  }
});
</script>
</body>
</html>
